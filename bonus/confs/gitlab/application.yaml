apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-iot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://gitlab.localhost/kyoulee/Inception-of-Things.git'
    targetRevision: main
    path: 'p3/confs/cluster'
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true