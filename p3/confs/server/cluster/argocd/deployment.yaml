apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/kyoulee/Inception-of-Things.git'
    targetRevision: argocd-test
    path: 'p3/confs/server/cluster'
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true